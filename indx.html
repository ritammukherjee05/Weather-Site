<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <!--Linking Google Fonts for icons-->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search" />
  <!-- Add this in the <head> -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">

    <!-- Search Section -->
    <div class="search-section">
      <div class="input-wrapper">
        <span class="material-symbols-rounded">search</span>
        <input type="search" placeholder="Enter a city name" class="search-input">
      </div>
      <button class="location-button">
        <i class="fas fa-map-marker-alt"></i>
      </button>
    </div>

    <!--No result message-->
    <div class="no-results">
      <img src="icons/no-result.svg" class="weather-icon">
      <h3 class="title">Something went wrong</h3>
      <p class="message">We're unable to retrieve the weather details. Ensure you have entered a valid city or try again
        later.</p>
    </div>

    <!-- Weather Section (moved outside search-section) -->
    <div class="weather-section">
      <!-- Current Weather -->
      <div class="current-weather">
        <img src="icons/clouds.svg" class="weather-icon">
        <h2 class="temperature">00<span>°C</span></h2>
        <p class="description">Weather description</p>
      </div>

      <!-- Hourly Forecast -->
      <div class="hourly-weather">
        <ul class="weather-list">
          <li class="weather-item">
            <p class="time">00:00</p>
            <img src="icons/clouds.svg" class="weather-icon">
            <p class="temperature">°C</p>
          </li>
          <!-- Repeat list items as needed -->
          <li class="weather-item">
            <p class="time">00:00</p>
            <img src="icons/clouds.svg" class="weather-icon">
            <p class="temperature">°C</p>
          </li>
          <li class="weather-item">
            <p class="time">00:00</p>
            <img src="icons/clouds.svg" class="weather-icon">
            <p class="temperature">°C</p>
          </li>
          <li class="weather-item">
            <p class="time">00:00</p>
            <img src="icons/clouds.svg" class="weather-icon">
            <p class="temperature">°C</p>
          </li>
          <li class="weather-item">
            <p class="time">00:00</p>
            <img src="icons/clouds.svg" class="weather-icon">
            <p class="temperature">°C</p>
          </li>
          <li class="weather-item">
            <p class="time">00:00</p>
            <img src="icons/clouds.svg" class="weather-icon">
            <p class="temperature">°C</p>
          </li>
        </ul>
      </div>
    </div>

  </div>
  <script src="script.js"></script>
</body>


</html>
